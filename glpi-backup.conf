# ==============================================================================
# GLPI BACKUP CONFIGURATION
# ==============================================================================

# --- Directory Configuration ---
GLPI_DIR="/var/www/html/glpi"
BACKUP_ROOT="/var/lib/glpi-backups"
LOG_FILE="/var/log/glpi-backup/backup.log"

# --- Database Credentials ---
# Ensure this user has LOCK TABLES and TRIGGER permissions
DB_HOST="localhost"
DB_NAME="glpi"
DB_USER="glpi_db_user"
DB_PASS="your_secure_password_here"

# --- Retention Policy ---
RETENTION_DAYS=30
MIN_DISK_SPACE_MB=2048  # Minimum 2GB free required to run

# --- Notifications (Optional) ---
# Leave empty to disable. Supports Slack/Discord/Teams (JSON payload)
WEBHOOK_URL=""
SERVER_NAME="GLPI-Production-Server"
